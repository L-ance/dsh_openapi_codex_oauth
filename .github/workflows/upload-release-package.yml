name: Upload release package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to create or update from main
        required: true
        default: v0.2.0

permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref_name || 'main' }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26.0.0
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Test package
        run: npm test

      - name: Build release tarball
        id: pack
        run: |
          PACKAGE_FILE="$(npm pack --silent)"
          echo "file=$PACKAGE_FILE" >> "$GITHUB_OUTPUT"

      - name: Validate release version
        env:
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          test "$RELEASE_TAG" = "v$PACKAGE_VERSION"

      - name: Create release if needed
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
        run: |
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || \
            gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --generate-notes

      - name: Upload release asset
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
          PACKAGE_FILE: ${{ steps.pack.outputs.file }}
        run: gh release upload "$RELEASE_TAG" "$PACKAGE_FILE" --clobber
